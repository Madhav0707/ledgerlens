services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - ledgerlens_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens -d ledgerlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      AUTO_CREATE_SCHEMA: "true"
      DATABASE_URL: postgresql+psycopg://ledgerlens:change-this-password@db:5432/ledgerlens
      APP_SECRET_KEY: change-this-development-secret
    ports:
      - "8501:8501"

volumes:
  ledgerlens_postgres:
